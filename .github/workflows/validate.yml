name: Validate repository sources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public source bundle
        run: python3 scripts/indexx_export.py --check
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Check shell syntax
        run: bash -n scripts/indexx-status.sh
      - name: Check whitespace
        run: git show --format= --check HEAD
