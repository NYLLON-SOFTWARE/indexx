name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: >-
          python -m pip install jsonschema==4.25.1
          'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate Agent Skills format
        run: skills-ref validate skills/instagram-saved-ids
      - name: Validate Agent Plugins manifest
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from jsonschema import Draft202012Validator
          manifest = json.loads(Path('plugin.json').read_text())
          with urllib.request.urlopen(manifest['$schema'], timeout=30) as response:
              schema = json.load(response)
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(manifest)
          print('Agent Plugins 1.0.0 manifest is valid')
          PY
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript without Node APIs
        run: node --test tests/export_ids.test.cjs
      - name: Check exporter and release packages
        run: python -m unittest discover -s tests -v
      - name: Build distributable archives
        run: python scripts/build_release.py
